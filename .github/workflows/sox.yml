# workflow
name: SOX日报推送

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-sox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install akshare requests
      - name: 运行脚本
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
        run: python sox_daily.py
